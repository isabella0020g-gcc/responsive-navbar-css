<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Navbar</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
      }

      header {
        background-color: #222;
        padding: 20px;
      }

      nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .logo {
        color: white;
        font-size: 24px;
        font-weight: bold;
      }

      .nav-links {
        display: flex;
        gap: 20px;
        flex-direction: row;
      }

      .nav-links a {
        color: white;
        text-decoration: none;
        font-size: 18px;
      }

      @media (max-width: 768px) {
        nav {
          flex-direction: column;
          gap: 15px;
        }

        .nav-links {
          flex-direction: column;
          align-items: center;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <nav>
        <div class="logo">Logo</div>

        <div class="nav-links">
          <a href="#">Home</a>
          <a href="#">About</a>
          <a href="#">Projects</a>
          <a href="#">Contact</a>
        </div>
      </nav>
    </header>
  </body>
</html>
